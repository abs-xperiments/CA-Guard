[project]
name = "caguard"
version = "0.1.0"
description = "Privacy-preserving on-premise hybrid AI framework for evidence-grounded financial anomaly detection and human-in-the-loop audit review"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "pandas>=3.0,<4",
    "pyarrow>=25,<26",
    "openpyxl>=3.1,<4",
    "scikit-learn>=1.9,<2",
    "fastapi>=0.136,<1",
    "uvicorn>=0.34",
    "typer>=0.15",
    "python-multipart>=0.0.32",
    "xlrd>=2.0.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-cov>=6",
    "ruff>=0.15",
    "pyright>=1.1.400",
    "httpx>=0.28",
]

[project.scripts]
caguard = "caguard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caguard"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PTH", "ARG", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]  # ambiguous unicode: ₹ and en dashes are deliberate

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
# FastAPI expresses dependencies as call-valued argument defaults, and a
# dependency whose value the handler does not read is still doing its job — the
# `user` argument on a protected route exists to enforce the session, not to be
# used. Fighting the framework here would make the code worse, not safer.
"src/caguard/api/*" = ["ARG001", "B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs the downloaded VynFi corpus (deselect with '-m \"not slow\"')",
]
