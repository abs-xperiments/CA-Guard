name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitHub Actions is free for public repositories; nothing here costs money.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      # The offline suite only. The `slow` test needs the VynFi corpus, which is
      # downloaded locally rather than pulled on every CI run.
      - name: Test
        run: uv run pytest -m "not slow"

      # A dependency audit performed once is a dependency audit that is out of
      # date. Free for public repositories, like everything else here.
      - name: Audit dependencies
        run: uv run --with pip-audit pip-audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev
